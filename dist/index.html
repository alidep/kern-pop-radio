      .theme-name{font-size:8px;letter-spacing:0}
      .theme-toggle{width:40px;height:23px}
      .theme-thumb{width:17px;height:17px}
      .radio{width:calc(100% - 28px);padding:25px 20px 30px}
      .top{gap:15px}
      .display{font-size:11px;letter-spacing:.07em;padding:9px 12px}
      .search-popover{width:calc(100% - 58px)}
      .presets{gap:30px 8px;margin-top:40px}
      .preset,.preset.empty{width:75px;height:75px}

    }
    @media(max-width:400px){[data-theme=retro] .radio{width:calc(100% - 28px);padding:0 10px 17px}[data-theme=retro] .retro-header{margin:2px -6px 15px}[data-theme=retro] .presets{gap:20px 6px}[data-theme=retro] .preset,[data-theme=retro] .preset.empty{width:88px;height:66px}[data-theme=retro] .search-popover{width:calc(100% - 53px)}}
    @media(prefers-reduced-motion:reduce){.preset{transition:none}.level-ring .fill{animation:none;stroke-dasharray:55 100}}
  </style>

<body>
  <div class="theme-row" role="group" aria-label="Radio appearance">
    <h1 class="wordmark">Little Radio.</h1>
    <div class="theme-controls">
      <span class="theme-name">MINIMAL</span>
      <button class="theme-toggle" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Windows 98 theme"><span class="theme-thumb" aria-hidden="true"></span></button>
      <span class="theme-name">WINDOWS 98</span>
    </div>
  </div>
  <main class="radio" aria-label="Little radio">
    <div class="retro-header" id="retro-header"><strong><span class="window-icon" aria-hidden="true">♫</span>Little Radio</strong><span class="window-controls"><button type="button" id="window-minimize" aria-label="Minimize Little Radio" title="Minimize">_</button><button type="button" id="window-maximize" aria-label="Maximize Little Radio" title="Maximize">□</button><button type="button" id="window-close" aria-label="Close Little Radio" title="Close">×</button></span></div>
    <div class="top">
      <div class="display" id="display-box" aria-live="polite"><span id="display">Choose a station</span><input id="search" type="search" placeholder="Search radio stations…" aria-label="Search radio stations" autocomplete="off" hidden></div>
      <button class="add" id="add" aria-label="Add or edit a station" title="Add or edit a station">+</button>
      <div class="search-popover" id="search-popover" hidden>
        <div class="search-top"><span>Save to preset</span><select id="search-slot" aria-label="Preset to save station"></select></div>
        <button class="manual" id="manual" type="button">Use a stream URL instead</button>
        <div class="location-row"><button class="location-button" id="use-location" type="button" title="Share your location to find nearby stations">⌖ Find local stations</button><span class="location-status" id="location-status" aria-live="polite"></span></div>
        <div class="saved-section" id="saved-section" hidden><div class="result-heading">Saved stations</div><div id="saved-results"></div></div>
        <div class="search-results" id="search-results"><div class="search-message">Loading popular stations…</div></div>
      </div>
    </div>
    <div class="presets" id="presets" aria-label="Six favorite stations"></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <button class="desktop-folder" id="desktop-folder" type="button" aria-label="Open Little Radio" hidden><img src="./folder-closed.png" alt=""><span>little radio</span></button>
  <button class="taskbar-button" id="taskbar-button" type="button" aria-label="Restore Little Radio" hidden><img src="./folder-open.png" alt=""><span>Little Radio</span></button>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="form" method="dialog">
      <div class="modal-head"><h1 id="editor-title">Add a station</h1><button class="close" type="button" id="close" aria-label="Close">×</button></div>
      <label>Preset
        <select id="slot" name="slot" aria-label="Preset slot"></select>
      </label>
      <label>Station name
        <input id="name" name="name" maxlength="45" required placeholder="e.g. Jack.fm 90.3fm" autocomplete="off">
      </label>
      <label>Direct stream URL
        <input id="url" name="url" type="url" required placeholder="https://example.com/live.mp3" spellcheck="false" inputmode="url">
        <small>Use a direct HTTPS MP3 or AAC stream, not a station webpage.</small>
      </label>
      <p class="error" id="error" role="alert"></p>
      <div class="actions"><button class="remove" id="remove" type="button" hidden>Remove</button><button class="save" type="submit">Save station</button></div>
    </form>
  </dialog>
  <audio id="audio" preload="none"></audio>
  <script>
    (() => {
      const defaults=[
        {name:'FIP',url:'https://icecast.radiofrance.fr/fip-midfi.mp3'},
        {name:'FIP Jazz',url:'https://icecast.radiofrance.fr/fipjazz-midfi.mp3'},
        {name:'FIP Groove',url:'https://icecast.radiofrance.fr/fipgroove-midfi.mp3'},
        {name:'FIP Rock',url:'https://icecast.radiofrance.fr/fiprock-midfi.mp3'},
        null,null
      ];
      const key='little-radio-presets-v3', $=id=>document.getElementById(id);
      const themeKey='little-radio-theme-v1';let retro=false;
      const windowRadio=document.querySelector('.radio');
      let windowState='normal',beforeMinimize='normal',windowPosition=null;
      const folderKey='little-radio-folder-position-v1';let folderPosition=null;
      try{const saved=JSON.parse(localStorage.getItem(folderKey));if(Number.isFinite(saved?.x)&&Number.isFinite(saved?.y))folderPosition=saved}catch{}
      function placeFolder(x,y){
        const position={x:Math.max(41,Math.min(window.innerWidth-41,x)),y:Math.max(0,Math.min(window.innerHeight-86,y))};
        $('desktop-folder').style.left=position.x+'px';$('desktop-folder').style.top=position.y+'px';
        return position;
      }
      try{retro=localStorage.getItem(themeKey)==='retro'}catch{}
      function syncWindow(){
        windowRadio.hidden=retro&&(windowState==='minimized'||windowState==='closed');
        windowRadio.classList.toggle('maximized',windowState==='maximized');
        $('desktop-folder').hidden=!(retro&&windowState==='closed');
        $('taskbar-button').hidden=!(retro&&windowState==='minimized');
        $('window-maximize').setAttribute('aria-label',windowState==='maximized'?'Restore Little Radio':'Maximize Little Radio');
        $('window-maximize').title=windowState==='maximized'?'Restore':'Maximize';
      }
      function setTheme(){document.documentElement.dataset.theme=retro?'retro':'minimal';$('theme-toggle').setAttribute('aria-checked',String(retro));$('theme-toggle').title=retro?'Switch to minimal radio':'Switch to Windows 98 radio';syncWindow()}
      setTheme();
      $('theme-toggle').addEventListener('click',()=>{retro=!retro;setTheme();render();try{localStorage.setItem(themeKey,retro?'retro':'minimal')}catch{}});
      let stations=defaults;
      try{
        const saved=JSON.parse(localStorage.getItem(key)||localStorage.getItem('little-radio-presets-v2'));
        if(Array.isArray(saved)&&saved.length===6)stations=saved.map(s=>s&&typeof s.name==='string'&&typeof s.url==='string'?{name:s.name,url:s.url,uuid:typeof s.uuid==='string'?s.uuid:''}:null);
      }catch{}
      const savedKey='little-radio-saved-v1';let savedStations=[];
      try{
        const stored=localStorage.getItem(savedKey);
        const rows=stored===null?(localStorage.getItem(key)||localStorage.getItem('little-radio-presets-v2')?stations.filter(Boolean):[]):JSON.parse(stored);
        if(Array.isArray(rows))savedStations=rows.filter(s=>s&&typeof s.name==='string'&&typeof s.url==='string'&&s.url.startsWith('https://')).map(s=>({name:s.name,url:s.url,uuid:typeof s.uuid==='string'?s.uuid:''})).slice(0,50);
        if(stored===null)localStorage.setItem(savedKey,JSON.stringify(savedStations));
      }catch{}
      let selected=-1,playing=false,request=0,searchTimer,searchAbort,searchOpen=false,place=null;
      const audio=$('audio'),list=$('presets');
      function restoreWindow(){windowState=windowState==='minimized'?beforeMinimize:'normal';syncWindow()}
      const folder=$('desktop-folder');let folderDrag=null,folderMoved=false;
      folder.addEventListener('pointerdown',event=>{
        if(event.pointerType==='mouse'&&event.button!==0)return;
        const rect=folder.getBoundingClientRect();
        folderDrag={id:event.pointerId,startX:event.clientX,startY:event.clientY,x:rect.left+rect.width/2,y:rect.top,moved:false};
        folderMoved=false;folder.setPointerCapture(event.pointerId);
      });
      folder.addEventListener('pointermove',event=>{
        if(!folderDrag||folderDrag.id!==event.pointerId)return;
        const dx=event.clientX-folderDrag.startX,dy=event.clientY-folderDrag.startY;
        if(Math.hypot(dx,dy)>3)folderDrag.moved=true;
        if(folderDrag.moved)folderPosition=placeFolder(folderDrag.x+dx,folderDrag.y+dy);
      });
      for(const name of ['pointerup','pointercancel'])folder.addEventListener(name,event=>{
        if(!folderDrag||folderDrag.id!==event.pointerId)return;
        if(folderDrag.moved){folderMoved=true;try{localStorage.setItem(folderKey,JSON.stringify(folderPosition))}catch{}}
        folderDrag=null;
      });
      folder.addEventListener('click',event=>{
        if(folderMoved){folderMoved=false;event.preventDefault();return}
        windowState='normal';syncWindow();
      });
      $('taskbar-button').addEventListener('click',restoreWindow);
      $('window-minimize').addEventListener('click',()=>{beforeMinimize=windowState;windowState='minimized';syncWindow()});
      $('window-maximize').addEventListener('click',()=>{windowState=windowState==='maximized'?'normal':'maximized';syncWindow()});
      $('window-close').addEventListener('click',()=>{
        const rect=windowRadio.getBoundingClientRect();
        if(folderPosition)folderPosition=placeFolder(folderPosition.x,folderPosition.y);
        else placeFolder(rect.left+rect.width/2,rect.bottom+16);
        audio.pause();if(searchOpen)closeSearch();if($('editor').open)$('editor').close();
        windowState='closed';syncWindow();
      });
      const titlebar=$('retro-header');let drag=null;
      titlebar.addEventListener('pointerdown',event=>{
        if(!retro||windowState!=='normal'||event.target.closest('button'))return;
        const rect=windowRadio.getBoundingClientRect();
        drag={id:event.pointerId,offsetX:event.clientX-rect.left,offsetY:event.clientY-rect.top,width:rect.width};
        titlebar.setPointerCapture(event.pointerId);
      });
      titlebar.addEventListener('pointermove',event=>{
        if(!drag||event.pointerId!==drag.id)return;
        const left=Math.max(0,Math.min(window.innerWidth-drag.width,event.clientX-drag.offsetX));
        const top=Math.max(0,Math.min(window.innerHeight-30,event.clientY-drag.offsetY));
        windowPosition={left,top};windowRadio.style.left=left+'px';windowRadio.style.top=top+'px';windowRadio.style.transform='none';
      });
      for(const name of ['pointerup','pointercancel'])titlebar.addEventListener(name,event=>{if(drag?.id===event.pointerId)drag=null});
      titlebar.addEventListener('dblclick',event=>{if(!event.target.closest('button'))$('window-maximize').click()});
      window.addEventListener('resize',()=>{
        if(folderPosition)folderPosition=placeFolder(folderPosition.x,folderPosition.y);
        if(!windowPosition)return;
        const rect=windowRadio.getBoundingClientRect();
        windowPosition.left=Math.max(0,Math.min(windowPosition.left,window.innerWidth-rect.width));
        windowPosition.top=Math.max(0,Math.min(windowPosition.top,window.innerHeight-30));
        windowRadio.style.left=windowPosition.left+'px';windowRadio.style.top=windowPosition.top+'px';
      });
      function persist(){try{localStorage.setItem(key,JSON.stringify(stations))}catch{$('status').textContent='This browser could not save your stations.'}}
      function persistSaved(){try{localStorage.setItem(savedKey,JSON.stringify(savedStations))}catch{$('status').textContent='This browser could not save your stations.'}}
      function rememberStation(station){
        savedStations=[{name:station.name,url:station.url,uuid:station.uuid||''},...savedStations.filter(s=>s.url!==station.url)].slice(0,50);
        persistSaved();
      }
      function display(text){$('display').textContent=text}
      function render(){
        list.replaceChildren();
        document.querySelector('.radio').classList.toggle('on-air',playing);
        stations.forEach((station,i)=>{
          const slot=document.createElement('div');slot.className='preset-slot'+(station?' filled':'')+(playing&&selected===i?' current':'');
          const button=document.createElement('button');
          button.type='button';button.className='preset'+(station?'':' empty')+(playing&&selected===i?' playing':'');
          const label=station?station.name:'Empty preset';
          button.setAttribute('aria-label',station?(playing&&selected===i?'Pause ':'Play ')+label+', preset '+(i+1):'Add station to preset '+(i+1));
          button.title=label+' · '+(i+1);
          button.addEventListener('click',()=>station?tune(i):openSearch(i));
          const file=document.createElement('span');file.className='file-icon';file.setAttribute('aria-hidden','true');
          file.innerHTML='<img class="folder-closed" src="./folder-closed.png" alt=""><img class="folder-open" src="./folder-open.png" alt="">';
          button.append(file);
          const ring=document.createElementNS('http://www.w3.org/2000/svg','svg');ring.setAttribute('class','level-ring');ring.setAttribute('viewBox','0 0 122 122');ring.setAttribute('aria-hidden','true');
          for(const kind of ['track','fill']){const arc=document.createElementNS('http://www.w3.org/2000/svg','path');arc.setAttribute('class',kind);arc.setAttribute('d','M 27 104 A 55 55 0 1 1 95 104');arc.setAttribute('pathLength','100');ring.append(arc)}
          button.append(ring);
          const caption=document.createElement(station?'button':'span');caption.className='preset-label';caption.textContent=station?station.name:'Empty';
          if(station){const action=playing&&selected===i?'Pause ':'Play ';caption.type='button';caption.title=retro?action+station.name:'Change '+station.name;caption.setAttribute('aria-label',retro?action+station.name+', preset '+(i+1):'Change station in preset '+(i+1));caption.addEventListener('click',()=>retro?tune(i):openSearch(i))}
          slot.append(button,caption);list.append(slot);
        });
      }
      async function tune(i){
        const station=stations[i];
        if(!station)return openSearch(i);
        if(searchOpen)closeSearch();
        if(playing&&selected===i){audio.pause();return}
        const thisRequest=++request;
        if(selected!==i||audio.src!==station.url){audio.pause();audio.src=station.url;audio.load()}
        selected=i;playing=false;display('Tuning '+station.name+'…');$('status').textContent='Connecting to '+station.name;render();
        try{
          await audio.play();
          if(thisRequest!==request||audio.paused)return;
          playing=true;display('Now playing '+station.name);$('status').textContent='Playing '+station.name;render();
          if(station.uuid)fetch('https://de1.api.radio-browser.info/json/url/'+encodeURIComponent(station.uuid),{method:'POST',keepalive:true}).catch(()=>{});
        }catch{
          if(thisRequest!==request)return;
          playing=false;display('Stream unavailable');$('status').textContent='Could not play '+station.name+'. Check its stream URL.';render();
        }
      }
      audio.addEventListener('playing',()=>{
        const station=stations[selected];
        if(!station||audio.paused)return;
        playing=true;display('Now playing '+station.name);$('status').textContent='Playing '+station.name;render();
      });
      audio.addEventListener('pause',()=>{if(playing){playing=false;display('Paused '+stations[selected].name);$('status').textContent='Paused '+stations[selected].name;render()}});
      audio.addEventListener('error',()=>{if(selected>=0){playing=false;display('Stream unavailable');$('status').textContent='Check the station stream URL.';render()}});
      function chooseStation(station){
        const i=Number($('search-slot').value),previous=stations[i],samePlaying=playing&&selected===i&&previous?.url===station.url;
        if(i===selected&&previous?.url!==station.url){++request;audio.pause();audio.removeAttribute('src');audio.load();playing=false;selected=-1}
        stations[i]={name:station.name,url:station.url,uuid:station.uuid||''};persist();rememberStation(stations[i]);closeSearch();
        if(samePlaying){display('Now playing '+station.name);render()}
        else{render();tune(i)}
      }
      function renderSaved(q=''){
        const rows=savedStations.filter(s=>s.name.toLowerCase().includes(q.toLowerCase())).slice(0,12),target=$('saved-results');
        $('saved-section').hidden=!rows.length;target.replaceChildren();
        rows.forEach(station=>{
          const row=document.createElement('div');row.className='saved-row';
          const choose=document.createElement('button');choose.type='button';choose.className='search-result';choose.setAttribute('aria-label','Add '+station.name+' to selected preset');
          const name=document.createElement('span');name.className='result-name';name.textContent=station.name;
          choose.append(name);choose.addEventListener('click',()=>chooseStation(station));
          const forget=document.createElement('button');forget.type='button';forget.className='saved-forget';forget.textContent='×';forget.title='Forget '+station.name;forget.setAttribute('aria-label','Forget '+station.name);
          forget.addEventListener('click',()=>{savedStations=savedStations.filter(s=>s.url!==station.url);persistSaved();renderSaved($('search').value.trim())});
          row.append(choose,forget);target.append(row);
        });
      }
      function searchMessage(message){$('search-results').replaceChildren();const item=document.createElement('div');item.className='search-message';item.textContent=message;$('search-results').append(item)}
      function closeSearch(){
        searchOpen=false;clearTimeout(searchTimer);searchAbort?.abort();
        $('search').hidden=true;$('display').hidden=false;$('search-popover').hidden=true;$('search').value='';
      }
      function openSearch(i){
        if(!Number.isInteger(i)||i<0||i>5)i=0;
        $('search-slot').replaceChildren();
        stations.forEach((s,index)=>{const option=document.createElement('option');option.value=index;option.textContent=String(index+1).padStart(2,'0')+(s?' · '+s.name:' · Empty');$('search-slot').append(option)});
        $('search-slot').value=String(i);$('display').hidden=true;$('search').hidden=false;$('search-popover').hidden=false;searchOpen=true;
        $('search').value='';renderSaved();searchMessage('Loading popular stations…');$('search').focus();searchStations();
      }
      const apiServers=['de1','de2','nl1'];
      const streamUrl=s=>String(s.url_resolved||s.url||'');
      function playable(s){
        const url=streamUrl(s),name=String(s.name||'').trim();
        if(!name||!url.startsWith('https://')||s.lastcheckok===0)return false;
        return !s.hls||!!audio.canPlayType('application/vnd.apple.mpegurl');
      }
      function popularity(s){return Math.log1p(Math.max(0,Number(s.clickcount)||0))*2+Math.log1p(Math.max(0,Number(s.votes)||0))}
      function relevance(s,q){const n=String(s.name||'').toLowerCase(),term=q.toLowerCase();return !q?0:n===term?0:n.startsWith(term)?1:n.includes(' '+term)?2:3}
      function best(rows,q,limit){
        const seen=new Set();
        return rows.filter(s=>playable(s)&&(!q||String(s.name).toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>relevance(a,q)-relevance(b,q)||popularity(b)-popularity(a)).filter(s=>{
          const identity=streamUrl(s).replace(/\/$/,'').toLowerCase();
          if(seen.has(identity))return false;seen.add(identity);return true;
        }).slice(0,limit);
      }
      function near(s){
        if(!place)return false;
        const country=String(s.countrycode||'').toUpperCase();
        if(country&&country!==place.country)return false;
        const lat=Number(s.geo_lat),lon=Number(s.geo_long);
        if(s.geo_lat!=null&&s.geo_long!=null&&Number.isFinite(lat)&&Number.isFinite(lon)){
          const rad=Math.PI/180,dLat=(lat-place.lat)*rad,dLon=(lon-place.lon)*rad;
          const a=Math.sin(dLat/2)**2+Math.cos(place.lat*rad)*Math.cos(lat*rad)*Math.sin(dLon/2)**2;
          if(6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))<=150)return true;
        }
        const state=String(s.state||'').toLowerCase();
        return !!state&&((place.city&&state.includes(place.city.toLowerCase()))||(place.region&&state.includes(place.region.toLowerCase()))||(place.regionCode&&state===place.regionCode.toLowerCase()));
      }
      async function directory(params,signal){
        for(const server of apiServers){
          try{
            const response=await fetch('https://'+server+'.api.radio-browser.info/json/stations/search?'+params,{signal,headers:{Accept:'application/json'}});
            if(!response.ok)throw Error('Directory unavailable');
            const rows=await response.json();if(Array.isArray(rows))return rows;
          }catch(error){if(signal.aborted)return null}
        }
        return null;
      }
      function query(q,order,local){
        const params=new URLSearchParams({hidebroken:'true',is_https:'true',limit:local?'120':'180',order,reverse:'true'});
        if(q)params.set('name',q);
        if(local&&place){params.set('countrycode',place.country);params.set('state',local)}
        return params;
      }
      function heading(text){const el=document.createElement('div');el.className='result-heading';el.textContent=text;$('search-results').append(el)}
      function addResults(rows){
        rows.forEach(s=>{
          const button=document.createElement('button');button.type='button';button.className='search-result';
          const name=document.createElement('span');name.className='result-name';name.textContent=s.name;
          const meta=document.createElement('span');meta.className='result-meta';meta.textContent=[s.state||s.countrycode,s.codec].filter(Boolean).join(' · ');
          button.append(name,meta);
          button.addEventListener('click',()=>{
            chooseStation({name:String(s.name).trim(),url:String(s.url_resolved||s.url),uuid:String(s.stationuuid||'')});
          });
          $('search-results').append(button);
        });
      }
      async function searchStations(){
        const q=$('search').value.trim();searchAbort?.abort();
        renderSaved(q);
        if(q.length===1){searchMessage('Type one more letter.');return}
        const controller=new AbortController();searchAbort=controller;searchMessage(q?'Searching…':'Loading popular stations…');
        const locationAtStart=place;
        const requests=[directory(query(q,'clickcount'),controller.signal),directory(query(q,'votes'),controller.signal)];
        if(place){
          const regions=[place.city,place.region,place.regionCode].filter((v,i,a)=>v&&a.indexOf(v)===i);
          for(const region of regions)requests.push(directory(query(q,'clickcount',region),controller.signal));
        }
        const responses=await Promise.all(requests);
        if(controller.signal.aborted||!searchOpen||$('search').value.trim()!==q||locationAtStart!==place)return;
        const globalRows=responses.slice(0,2).flatMap(rows=>rows||[]),localRows=responses.slice(2).flatMap(rows=>rows||[]);
        if(!responses.some(Array.isArray)){searchMessage('Search is unavailable. Try again or use a stream URL.');return}
        const local=place?best([...localRows,...globalRows].filter(near),q,5):[];
        const localUrls=new Set(local.map(streamUrl));
        const worldwide=best(globalRows.filter(s=>!localUrls.has(streamUrl(s))),q,9);
        $('search-results').replaceChildren();
        if(local.length){heading('Local & regional · '+(place.region||place.country));addResults(local)}
        if(worldwide.length){heading(q?'Popular everywhere':'Popular stations');addResults(worldwide)}
        if(!local.length&&!worldwide.length)searchMessage('No playable matches. Try a shorter name or use a stream URL.');
      }
      $('use-location').addEventListener('click',()=>{
        if(!navigator.geolocation){$('location-status').textContent='Location unavailable';return}
        $('location-status').textContent='Locating…';$('use-location').disabled=true;
        navigator.geolocation.getCurrentPosition(async position=>{
          const lat=position.coords.latitude,lon=position.coords.longitude;
          try{
            const params=new URLSearchParams({latitude:String(lat),longitude:String(lon),localityLanguage:'en'});
            const response=await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?'+params);
            if(!response.ok)throw Error('Location lookup unavailable');
            const data=await response.json(),country=String(data.countryCode||'').toUpperCase();
            if(!/^[A-Z]{2}$/.test(country))throw Error('Country unavailable');
            place={lat,lon,country,city:String(data.city||data.locality||''),region:String(data.principalSubdivision||''),regionCode:String(data.principalSubdivisionCode||'').split('-').pop()};
            $('location-status').textContent=[place.city,place.region].filter(Boolean).join(', ')||country;
            $('use-location').textContent='⌖ Update location';
            if(searchOpen)searchStations();
          }catch{$('location-status').textContent='Local search unavailable'}
          finally{$('use-location').disabled=false}
        },()=>{$('location-status').textContent='Location not shared';$('use-location').disabled=false},{enableHighAccuracy:false,maximumAge:900000,timeout:10000});
      });
      $('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(searchStations,260)});
      $('search').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeSearch()}if(e.key==='Enter'){e.preventDefault();($('saved-results').querySelector('.search-result')||$('search-results').querySelector('button'))?.click()}});
      $('display-box').addEventListener('click',()=>{if(!searchOpen){const empty=stations.findIndex(s=>!s);openSearch(empty<0?0:empty)}});
      $('manual').addEventListener('click',()=>{const i=Number($('search-slot').value);closeSearch();openEditor(i)});
      document.addEventListener('keydown',e=>{if(searchOpen||$('editor').open||e.metaKey||e.ctrlKey||e.altKey||e.key.length!==1||e.target.closest('input,select,textarea'))return;e.preventDefault();const empty=stations.findIndex(s=>!s);openSearch(empty<0?0:empty);$('search').value=e.key;clearTimeout(searchTimer);searchTimer=setTimeout(searchStations,260)});
      function fillSlot(){
        const i=Number($('slot').value),s=stations[i];
        $('name').value=s?.name||'';$('url').value=s?.url||'';
        $('editor-title').textContent=s?'Edit a station':'Add a station';
        $('remove').hidden=!s;$('error').textContent='';
      }
      function openEditor(i){
        $('slot').replaceChildren();
        stations.forEach((s,index)=>{const option=document.createElement('option');option.value=index;option.textContent=String(index+1).padStart(2,'0')+(s?' · '+s.name:' · Empty');$('slot').append(option)});
        $('slot').value=String(i);fillSlot();$('editor').showModal();$('name').focus();
      }
      $('add').addEventListener('click',()=>{if(searchOpen){closeSearch();return}const empty=stations.findIndex(s=>!s);openSearch(empty<0?0:empty)});
      $('slot').addEventListener('change',fillSlot);
      $('close').addEventListener('click',()=>$('editor').close());
      $('editor').addEventListener('click',e=>{if(e.target===$('editor'))$('editor').close()});
      $('form').addEventListener('submit',e=>{
        e.preventDefault();
        const i=Number($('slot').value),name=$('name').value.trim(),url=$('url').value.trim();let parsed;
        try{parsed=new URL(url)}catch{}
        if(!name||!parsed||parsed.protocol!=='https:'||/\.(m3u8?|pls)(?:[?#]|$)/i.test(parsed.pathname)){$('error').textContent='Enter a name and direct HTTPS audio stream URL.';return}
        if(i===selected&&stations[i]?.url!==url){++request;audio.pause();audio.removeAttribute('src');audio.load();playing=false;selected=-1}
        stations[i]={name,url};persist();rememberStation(stations[i]);render();$('editor').close();$('status').textContent='Preset '+(i+1)+' saved. Tap its circle to listen.';
      });
      $('remove').addEventListener('click',()=>{
        const i=Number($('slot').value);
        if(i===selected){++request;audio.pause();audio.removeAttribute('src');audio.load();playing=false;selected=-1;display('Choose a station')}
        stations[i]=null;persist();render();$('editor').close();$('status').textContent='Preset '+(i+1)+' is empty.';
      });
      render();
      if(document.modelContext?.registerTool){
        try{Promise.resolve(document.modelContext.registerTool({
          name:'save_radio_preset',title:'Save radio preset',description:'Save a direct HTTPS audio stream to one of the six radio presets on this device.',
          inputSchema:{type:'object',properties:{preset:{type:'integer',minimum:1,maximum:6},name:{type:'string'},url:{type:'string'}},required:['preset','name','url'],additionalProperties:false},
          annotations:{readOnlyHint:false,untrustedContentHint:true},
          execute(input){
            const i=input?.preset-1,name=typeof input?.name==='string'?input.name.trim():'',url=typeof input?.url==='string'?input.url.trim():'';let parsed;
            try{parsed=new URL(url)}catch{}
            if(!Number.isInteger(i)||i<0||i>5||!name||name.length>45||!parsed||parsed.protocol!=='https:'||/\.(m3u8?|pls)(?:[?#]|$)/i.test(parsed.pathname))throw Error('Choose preset 1–6, a name, and a direct HTTPS audio stream URL.');
            if(i===selected&&stations[i]?.url!==url){++request;audio.pause();audio.removeAttribute('src');audio.load();playing=false;selected=-1}
            stations[i]={name,url};persist();rememberStation(stations[i]);render();$('status').textContent='Preset '+(i+1)+' saved.';return {preset:i+1,name,saved:true};
          }
        })).catch(()=>{})}catch{}
      }
    })();
  </script>
</body>
</html>
