<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efeee8">
  <meta name="description" content="A simple radio for six favorite live stations.">
  <title>little radio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23efeee8'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%233b3d3b'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23ee7042'/%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box}
    :root{font-family:Arial,Helvetica,sans-serif;color:#272925;background:#fafaf8}
    body{margin:0;min-width:320px}
    button,input,select{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e8754d;outline-offset:4px}
    .radio{width:min(820px,calc(100% - 40px));margin:clamp(20px,8vh,80px) auto 0;background:linear-gradient(145deg,#f5f4ef,#e9e8e0);min-height:308px;padding:45px clamp(20px,7vw,83px) 41px;border:1px solid #d5d5ca;border-radius:20px;box-shadow:inset 0 2px 1px #fff,0 3px 0 #d4d4ca,0 20px 40px #3b3b3118}
    .top{display:flex;align-items:center;justify-content:space-between;gap:25px}
    .display{background:#303630;color:#e7ecda;min-height:64px;width:min(469px,calc(100% - 75px));display:flex;align-items:center;gap:15px;padding:11px 20px;border-radius:5px;border:3px solid #646961;box-shadow:inset 0 3px 9px #111a13a8,0 2px 1px #fff;font:600 clamp(16px,2.2vw,20px)/1.25 Arial,Helvetica,sans-serif;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .display:before{content:'';width:7px;height:7px;flex:none;border-radius:50%;background:#727d71;box-shadow:0 0 0 3px #1d251f}
    .radio.on-air .display:before{background:#ed7548;box-shadow:0 0 0 3px #1d251f,0 0 8px #ed7548}
    .display span{overflow:hidden;text-overflow:ellipsis}
    .add{width:51px;height:51px;flex:none;border:0;border-radius:50%;background:linear-gradient(145deg,#4b4d49,#2d302d);color:#ee7042;display:grid;place-items:center;font-size:28px;font-weight:300;line-height:1;padding:0 0 3px;box-shadow:inset 0 2px 2px #ffffff38,0 3px 0 #20231f,0 6px 11px #20231f40;transition:transform .15s,box-shadow .15s}
    .add:hover{transform:translateY(2px);box-shadow:inset 0 2px 2px #ffffff38,0 1px 0 #20231f,0 3px 7px #20231f40}
    .presets{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(12px,3.5vw,32px);margin-top:55px;align-items:start}
    .preset-slot{min-width:0;display:flex;flex-direction:column;align-items:center;gap:13px}
    .preset{border:4px solid #62655f;background:radial-gradient(circle at 40% 30%,#565954,#30332f 72%);border-radius:50%;width:72px;height:72px;max-width:100%;aspect-ratio:1;display:grid;place-items:center;color:#fff;box-shadow:inset 0 2px 4px #ffffff2b,inset 0 -3px 5px #0d100d8a,0 2px 0 #1f231f,0 5px 9px #2c302d3b;transition:transform .15s,box-shadow .15s}
    .preset:hover{transform:translateY(2px);box-shadow:inset 0 2px 4px #ffffff2b,inset 0 -3px 5px #0d100d8a,0 1px 0 #1f231f,0 2px 5px #2c302d3b}
    .preset.playing{background:radial-gradient(circle at 40% 30%,#4b4e48,#292d28 72%);border-color:#2a3029;box-shadow:inset 0 3px 7px #0009,0 0 0 3px #e8e8df}
    .preset.playing:after{content:'';width:11px;height:11px;border-radius:50%;background:#ee7042;box-shadow:0 0 0 4px #242923}
    .preset.empty{border:2px solid #bbbdb2;background:linear-gradient(145deg,#e6e6dd,#f7f7f1);box-shadow:inset 0 3px 7px #7d84734b,0 1px 1px #fff;color:#a0a397}
    .preset.empty:after{content:'+';font-size:21px;font-weight:300;line-height:1}
    .preset.empty:hover{background:#f5f5ef}
    .preset-label{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;text-transform:uppercase;font-size:10px;letter-spacing:.11em;font-weight:700;color:#6b6e65}
    .status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    dialog{border:1px solid #d1d1c8;border-radius:13px;padding:0;width:min(420px,calc(100% - 28px));box-shadow:0 20px 70px #0005;color:#202020;background:#f5f4ee}
    dialog::backdrop{background:#0007}
    form{padding:26px}
    .modal-head{display:flex;justify-content:space-between;align-items:start;gap:15px;margin-bottom:20px}
    h1{font:700 25px Arial,Helvetica,sans-serif;letter-spacing:-.05em;margin:0}
    .close{border:0;background:transparent;font-size:27px;line-height:1;padding:0;color:#555}
    label{display:block;font-size:13px;font-weight:700;margin:0 0 17px}
    input,select{display:block;width:100%;border:1px solid #aaa;border-radius:4px;padding:11px;margin-top:7px;background:#fff;color:#202020;font-size:15px}
    small{display:block;font-size:12px;font-weight:400;line-height:1.35;color:#777;margin-top:7px}
    .actions{display:flex;gap:10px;margin-top:20px}
    .save,.remove{padding:12px 15px;border:0;border-radius:4px;font-size:14px;font-weight:700}
    .save{background:#343934;color:#fff;flex:1}
    .remove{background:#eee;color:#555}
    .error{min-height:16px;font-size:12px;color:#a32b2b;margin:0}
    @media(max-width:690px){
      .radio{padding:28px 25px 30px;min-height:0}
      .display{min-height:54px}
      .presets{grid-template-columns:repeat(3,1fr);gap:28px 12px;margin-top:42px}
      .preset{width:70px;height:70px}
    }
    @media(max-width:400px){
      .radio{width:calc(100% - 28px);padding:24px 18px 29px}
      .display{font-size:16px;padding:9px 12px;width:calc(100% - 68px)}
      .presets{gap:22px 8px;margin-top:36px}
      .preset{width:62px;height:62px}
      .preset-label{font-size:9px;letter-spacing:.06em}
    }
    @media(prefers-reduced-motion:reduce){.preset{transition:none}}
  </style>
</head>
<body>
  <main class="radio" aria-label="Little radio">
    <div class="top">
      <div class="display" aria-live="polite"><span id="display">Choose a station</span></div>
      <button class="add" id="add" aria-label="Add or edit a station" title="Add or edit a station">+</button>
    </div>
    <div class="presets" id="presets" aria-label="Six favorite stations"></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="form" method="dialog">
      <div class="modal-head"><h1 id="editor-title">Add a station</h1><button class="close" type="button" id="close" aria-label="Close">×</button></div>
      <label>Preset
        <select id="slot" name="slot" aria-label="Preset slot"></select>
      </label>
      <label>Station name
        <input id="name" name="name" maxlength="45" required placeholder="e.g. Jack.fm 90.3fm" autocomplete="off">
      </label>
      <label>Direct stream URL
        <input id="url" name="url" type="url" required placeholder="https://example.com/live.mp3" spellcheck="false" inputmode="url">
        <small>Use a direct HTTPS MP3 or AAC stream, not a station webpage.</small>
      </label>
      <p class="error" id="error" role="alert"></p>
      <div class="actions"><button class="remove" id="remove" type="button" hidden>Remove</button><button class="save" type="submit">Save station</button></div>
    </form>
  </dialog>
  <audio id="audio" preload="none"></audio>
  <script>
    (() => {
      const defaults=[
        {name:'FIP',url:'https://icecast.radiofrance.fr/fip-midfi.mp3'},
        {name:'FIP Jazz',url:'https://icecast.radiofrance.fr/fipjazz-midfi.mp3'},
        {name:'FIP Groove',url:'https://icecast.radiofrance.fr/fipgroove-midfi.mp3'},
        {name:'FIP Rock',url:'https://icecast.radiofrance.fr/fiprock-midfi.mp3'},
        null,null
      ];
      const key='little-radio-presets-v3', $=id=>document.getElementById(id);
      let stations=defaults;
      try{
        const saved=JSON.parse(localStorage.getItem(key)||localStorage.getItem('little-radio-presets-v2'));
        if(Array.isArray(saved)&&saved.length===6)stations=saved.map(s=>s&&typeof s.name==='string'&&typeof s.url==='string'?{name:s.name,url:s.url}:null);
      }catch{}
      let selected=-1,playing=false,request=0;
      const audio=$('audio'),list=$('presets');
      function persist(){try{localStorage.setItem(key,JSON.stringify(stations))}catch{$('status').textContent='This browser could not save your stations.'}}
      function display(text){$('display').textContent=text}
      function render(){
        list.replaceChildren();
        document.querySelector('.radio').classList.toggle('on-air',playing);
        stations.forEach((station,i)=>{
          const slot=document.createElement('div');slot.className='preset-slot';
          const button=document.createElement('button');
          button.type='button';button.className='preset'+(station?'':' empty')+(playing&&selected===i?' playing':'');
          const label=station?station.name:'Empty preset';
          button.setAttribute('aria-label',station?(playing&&selected===i?'Pause ':'Play ')+label+', preset '+(i+1):'Add station to preset '+(i+1));
          button.title=label+' · '+(i+1);
          button.addEventListener('click',()=>station?tune(i):openEditor(i));
          const caption=document.createElement('span');caption.className='preset-label';caption.textContent=station?station.name:'Empty';
          slot.append(button,caption);list.append(slot);
        });
      }
      async function tune(i){
        const station=stations[i];
        if(!station)return openEditor(i);
        if(playing&&selected===i){audio.pause();return}
        const thisRequest=++request;
        if(selected!==i||audio.src!==station.url){audio.pause();audio.src=station.url;audio.load()}
        selected=i;playing=false;display('Tuning '+station.name+'…');render();
        try{
          await audio.play();
          if(thisRequest!==request)return;
          playing=true;display('Now playing '+station.name);$('status').textContent='Playing '+station.name;render();
        }catch{
          if(thisRequest!==request)return;
          playing=false;display('Stream unavailable');$('status').textContent='Could not play '+station.name+'. Check its stream URL.';render();
        }
      }
      audio.addEventListener('pause',()=>{if(playing){playing=false;display('Paused '+stations[selected].name);render()}});
      audio.addEventListener('error',()=>{if(selected>=0){playing=false;display('Stream unavailable');$('status').textContent='Check the station stream URL.';render()}});
      function fillSlot(){
        const i=Number($('slot').value),s=stations[i];
        $('name').value=s?.name||'';$('url').value=s?.url||'';
        $('editor-title').textContent=s?'Edit a station':'Add a station';
        $('remove').hidden=!s;$('error').textContent='';
      }
      function openEditor(i){
        $('slot').replaceChildren();
        stations.forEach((s,index)=>{const option=document.createElement('option');option.value=index;option.textContent=String(index+1).padStart(2,'0')+(s?' · '+s.name:' · Empty');$('slot').append(option)});
        $('slot').value=String(i);fillSlot();$('editor').showModal();$('name').focus();
      }
      $('add').addEventListener('click',()=>{const empty=stations.findIndex(s=>!s);openEditor(empty<0?0:empty)});
      $('slot').addEventListener('change',fillSlot);
      $('close').addEventListener('click',()=>$('editor').close());
      $('editor').addEventListener('click',e=>{if(e.target===$('editor'))$('editor').close()});
      $('form').addEventListener('submit',e=>{
        e.preventDefault();
        const i=Number($('slot').value),name=$('name').value.trim(),url=$('url').value.trim();let parsed;
        try{parsed=new URL(url)}catch{}
        if(!name||!parsed||parsed.protocol!=='https:'||/\.(m3u8?|pls)(?:[?#]|$)/i.test(parsed.pathname)){$('error').textContent='Enter a name and direct HTTPS audio stream URL.';return}
        if(i===selected&&stations[i]?.url!==url){++request;audio.pause();audio.removeAttribute('src');audio.load();playing=false;selected=-1}
        stations[i]={name,url};persist();render();$('editor').close();$('status').textContent='Preset '+(i+1)+' saved. Tap its circle to listen.';
      });
      $('remove').addEventListener('click',()=>{
        const i=Number($('slot').value);
        if(i===selected){++request;audio.pause();audio.removeAttribute('src');audio.load();playing=false;selected=-1;display('Choose a station')}
        stations[i]=null;persist();render();$('editor').close();$('status').textContent='Preset '+(i+1)+' is empty.';
      });
      render();
      if(document.modelContext?.registerTool){
        try{Promise.resolve(document.modelContext.registerTool({
          name:'save_radio_preset',title:'Save radio preset',description:'Save a direct HTTPS audio stream to one of the six radio presets on this device.',
          inputSchema:{type:'object',properties:{preset:{type:'integer',minimum:1,maximum:6},name:{type:'string'},url:{type:'string'}},required:['preset','name','url'],additionalProperties:false},
          annotations:{readOnlyHint:false,untrustedContentHint:true},
          execute(input){
            const i=input?.preset-1,name=typeof input?.name==='string'?input.name.trim():'',url=typeof input?.url==='string'?input.url.trim():'';let parsed;
            try{parsed=new URL(url)}catch{}
            if(!Number.isInteger(i)||i<0||i>5||!name||name.length>45||!parsed||parsed.protocol!=='https:'||/\.(m3u8?|pls)(?:[?#]|$)/i.test(parsed.pathname))throw Error('Choose preset 1–6, a name, and a direct HTTPS audio stream URL.');
            if(i===selected&&stations[i]?.url!==url){++request;audio.pause();audio.removeAttribute('src');audio.load();playing=false;selected=-1}
            stations[i]={name,url};persist();render();$('status').textContent='Preset '+(i+1)+' saved.';return {preset:i+1,name,saved:true};
          }
        })).catch(()=>{})}catch{}
      }
    })();
  </script>
</body>
</html>
